name: Release

# Manual release path: pushing a v* tag builds, (optionally) signs/notarizes/Sparkle-signs, uploads
# to R2, and attaches the artifact to the release. The automated path (release-please.yml) calls the
# same reusable workflow, so the logic lives in one place.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
    secrets: inherit
