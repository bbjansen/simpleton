name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run CoreChecks
        run: swift run -c release CoreChecks

      - name: Assemble app bundle (ad-hoc signed)
        run: bash scripts/e2e/make-app-bundle.sh release

      - name: Zip app bundle
        run: |
          cd .build
          ditto -c -k --keepParent Simpleton.app "Simpleton-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          # Release notes are curated per release (see CHANGELOG.md); leave an existing
          # release body untouched and just attach the freshly built artifact.
          files: .build/Simpleton-${{ github.ref_name }}.zip
