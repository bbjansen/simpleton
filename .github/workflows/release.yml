name: Release

# Manual release path: pushing a v* tag builds, (optionally) signs/notarizes/Sparkle-signs, uploads
# to R2, and attaches the artifact to the release. The automated path (release-please.yml) calls the
# same reusable workflow, so the logic lives in one place.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.5
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
