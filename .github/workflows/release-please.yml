name: Release Please

# Automated release system: release-please watches Conventional Commits on main, maintains a
# release pull request (version bump + CHANGELOG), and when that PR is merged it tags the release
# and creates the GitHub Release. A dependent macOS job then builds and attaches the .app bundle.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-app:
    name: Build & attach app bundle
    needs: release-please
    # v4 manifest mode: `releases_created` (plural) is the reliable "a release happened" flag; the
    # singular `release_created` is unset in this setup, which is why this job used to always skip.
    if: ${{ needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
