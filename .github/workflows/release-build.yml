name: Release Build

# Reusable build→sign→notarize→Sparkle-sign→publish pipeline, called by both release triggers
# (release-please.yml on a release-PR merge, and release.yml on a manual v* tag push) so the
# signing/notarization/appcast logic lives in exactly one place.
#
# Everything beyond the plain build is GUARDED on the presence of secrets: with no secrets set the
# job still produces today's unsigned bundle and attaches it to the release, so the pipeline keeps
# working before go-live. Add the secrets/vars (see docs/release-and-updates.md) to turn on
# Developer ID signing, notarization, Sparkle EdDSA signing, and the R2 upload.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build
        required: true
        type: string
      tag:
        description: Release tag name (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize & publish
    runs-on: macos-15
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # full history so the build number (commit count) is correct

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Compute version numbers
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          SHORT="${TAG#v}"               # v1.2.0 -> 1.2.0
          BUILD="$(git rev-list --count HEAD)"   # monotonic build number; Sparkle compares this
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $SHORT (build $BUILD)"

      - name: Detect available secrets
        id: gate
        env:
          DEV_ID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Decoupled gates: notarization needs Apple creds; Sparkle update-signing needs only the
          # EdDSA key; publishing to R2 needs the key + Cloudflare. So updates work WITHOUT Apple
          # (unsigned but EdDSA-signed), and notarization layers on later when the Apple secrets exist.
          NOTARIZE=false
          if [ -n "$DEV_ID_P12" ] && [ -n "$ASC_KEY" ]; then NOTARIZE=true; fi
          SPARKLE=false
          if [ -n "$SPARKLE_KEY" ]; then SPARKLE=true; fi
          PUBLISH=false
          if [ "$SPARKLE" = true ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then PUBLISH=true; fi
          {
            echo "notarize=$NOTARIZE"
            echo "sparkle=$SPARKLE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE  sparkle=$SPARKLE  publish=$PUBLISH"

      - name: Build (release)
        run: swift build -c release

      - name: Run CoreChecks
        run: swift run -c release CoreChecks

      - name: Import Developer ID certificate
        if: steps.gate.outputs.notarize == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dev_id.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          # shellcheck disable=SC2046  # intentional: re-add existing keychains to the search list as args
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security find-identity -v -p codesigning "$KC"

      - name: Assemble app bundle
        env:
          SIMPLETON_SHORT_VERSION: ${{ steps.ver.outputs.short }}
          SIMPLETON_BUILD_VERSION: ${{ steps.ver.outputs.build }}
          # Feed URL + public key are repo VARIABLES (not secrets). Auto-checks turn on when BOTH a
          # feed URL and a public key are configured (independent of Apple signing), so updates work
          # without notarization but we never auto-check a placeholder feed.
          SIMPLETON_SU_FEED_URL: ${{ vars.SIMPLETON_SU_FEED_URL }}
          SIMPLETON_SU_PUBLIC_ED_KEY: ${{ vars.SIMPLETON_SU_PUBLIC_ED_KEY }}
          SIMPLETON_SU_AUTO_CHECKS: ${{ (vars.SIMPLETON_SU_PUBLIC_ED_KEY != '' && vars.SIMPLETON_SU_FEED_URL != '') && 'true' || 'false' }}
          SIMPLETON_SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
        run: bash scripts/e2e/make-app-bundle.sh release

      - name: Developer ID sign (hardened runtime, inside-out)
        if: steps.gate.outputs.notarize == 'true'
        env:
          SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP=".build/Simpleton.app"
          FW="$APP/Contents/MacOS/Sparkle.framework" # this app embeds Sparkle under MacOS/
          FWV="$FW/Versions/B"                        # Sparkle 2.x layout
          sign() { codesign -f -s "$SIGN_IDENTITY" -o runtime --timestamp "$@"; }
          # Skip components that aren't present, but let a real signing failure fail the job.
          if [ -d "$FWV/XPCServices/Installer.xpc" ]; then sign "$FWV/XPCServices/Installer.xpc"; fi
          if [ -d "$FWV/XPCServices/Downloader.xpc" ]; then
            codesign -f -s "$SIGN_IDENTITY" -o runtime --timestamp \
              --preserve-metadata=entitlements "$FWV/XPCServices/Downloader.xpc"
          fi
          if [ -e "$FWV/Autoupdate" ]; then sign "$FWV/Autoupdate"; fi
          if [ -d "$FWV/Updater.app" ]; then sign "$FWV/Updater.app"; fi
          if [ -d "$FW" ]; then sign "$FW"; fi
          sign "$APP/Contents/MacOS/Simpleton"
          sign "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Notarize, staple, and package
        id: pkg
        env:
          NOTARIZE: ${{ steps.gate.outputs.notarize }}
          SHORT: ${{ steps.ver.outputs.short }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP=".build/Simpleton.app"
          OUT=".build/Simpleton-${SHORT}.zip"
          if [ "$NOTARIZE" = "true" ]; then
            KEY="$RUNNER_TEMP/asc.p8"
            echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl -a -t exec -vv "$APP" || true
          fi
          ditto -c -k --keepParent "$APP" "$OUT"
          echo "zip=$OUT" >> "$GITHUB_OUTPUT"

      - name: Sparkle EdDSA sign the update
        id: sparkle
        if: steps.gate.outputs.sparkle == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          # Use ONLY the sign_update that ships inside Sparkle's SPM artifact — its integrity is
          # already pinned via Package.resolved's checksum. Never download an unverified tool here:
          # this step pipes the private signing key into it.
          SIGN_UPDATE="$(find .build/artifacts -path '*/Sparkle/bin/sign_update' | head -n1 || true)"
          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::sign_update not found under .build/artifacts (Sparkle SPM artifact)." >&2
            echo "::error::Refusing to fetch an unverified tool to handle the private signing key." >&2
            exit 1
          fi
          SIG_OUT="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "$ZIP")"
          echo "$SIG_OUT"
          ED="$(printf '%s' "$SIG_OUT" | sed -E 's/.*edSignature="([^"]+)".*/\1/')"
          LEN="$(printf '%s' "$SIG_OUT" | sed -E 's/.*length="([0-9]+)".*/\1/')"
          echo "edsig=$ED" >> "$GITHUB_OUTPUT"
          echo "length=$LEN" >> "$GITHUB_OUTPUT"

      - name: Publish update to R2 (zip + sidecar + appcast)
        if: steps.gate.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'simpleton-updates' }}
          FEED_URL: ${{ vars.SIMPLETON_SU_FEED_URL }}
          SHORT: ${{ steps.ver.outputs.short }}
          BUILD: ${{ steps.ver.outputs.build }}
          EDSIG: ${{ steps.sparkle.outputs.edsig }}
          LENGTH: ${{ steps.sparkle.outputs.length }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          FILE="Simpleton-${SHORT}.zip"
          SIDE="$RUNNER_TEMP/Simpleton-${SHORT}.json"
          APPCAST="$RUNNER_TEMP/appcast.xml"
          PUBDATE="$(date -u +'%a, %d %b %Y %H:%M:%S +0000')"
          # Public base = the feed URL without its trailing /appcast.xml, so enclosures resolve on the
          # same public R2 host.
          BASE="${FEED_URL%/appcast.xml}"
          if [ -z "$BASE" ] || [ "$BASE" = "$FEED_URL" ]; then
            echo "::error::SIMPLETON_SU_FEED_URL must be set to <public-base>/appcast.xml" >&2; exit 1
          fi
          ENCLOSURE="${BASE}/releases/${FILE}"
          # Sidecar JSON — the contract with services/update-server for a future Worker-served feed.
          jq -n \
            --arg version "$BUILD" --arg shortVersionString "$SHORT" --arg pubDate "$PUBDATE" \
            --arg edSignature "$EDSIG" --argjson length "$LENGTH" --arg minimumSystemVersion "14.0" \
            '{version:$version, shortVersionString:$shortVersionString, pubDate:$pubDate, edSignature:$edSignature, length:$length, minimumSystemVersion:$minimumSystemVersion}' \
            > "$SIDE"
          # Static single-item appcast (the latest release), served straight from the public R2 bucket.
          # base64 edSignature and the URL contain no XML-special characters, so no escaping is needed.
          {
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>'
            printf '%s\n' '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            printf '%s\n' '  <channel>'
            printf '%s\n' '    <title>Simpleton</title>'
            printf '%s\n' '    <item>'
            printf '      <title>%s</title>\n' "$SHORT"
            printf '      <pubDate>%s</pubDate>\n' "$PUBDATE"
            printf '      <sparkle:version>%s</sparkle:version>\n' "$BUILD"
            printf '      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$SHORT"
            printf '%s\n' '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            printf '      <enclosure url="%s" length="%s" type="application/octet-stream" sparkle:edSignature="%s" />\n' "$ENCLOSURE" "$LENGTH" "$EDSIG"
            printf '%s\n' '    </item>'
            printf '%s\n' '  </channel>'
            printf '%s\n' '</rss>'
          } > "$APPCAST"
          cat "$APPCAST"
          wr() { npx --yes wrangler@4.153.0 r2 object put "$@"; }
          wr "${R2_BUCKET}/releases/${FILE}" --file "$ZIP" --remote --content-type application/zip
          wr "${R2_BUCKET}/releases/Simpleton-${SHORT}.json" --file "$SIDE" --remote --content-type application/json
          wr "${R2_BUCKET}/appcast.xml" --file "$APPCAST" --remote --content-type application/xml

      - name: Attach artifact to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.pkg.outputs.zip }}
