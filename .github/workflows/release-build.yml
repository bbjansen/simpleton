name: Release Build

# Reusable build→sign→notarize→Sparkle-sign→publish pipeline, called by both release triggers
# (release-please.yml on a release-PR merge, and release.yml on a manual v* tag push) so the
# signing/notarization/appcast logic lives in exactly one place.
#
# Everything beyond the plain build is GUARDED on the presence of secrets: with no secrets set the
# job still produces today's unsigned bundle and attaches it to the release, so the pipeline keeps
# working before go-live. Add the secrets/vars (see docs/release-and-updates.md) to turn on
# Developer ID signing, notarization, Sparkle EdDSA signing, and the R2 upload.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to build
        required: true
        type: string
      tag:
        description: Release tag name (e.g. v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build, sign, notarize & publish
    runs-on: macos-15
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # full history so the build number (commit count) is correct

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: swift --version

      - name: Compute version numbers
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only build v-prefixed tags. inputs come from a push-tag or workflow_dispatch (both require
          # write access), but validate the shape anyway before anything is published.
          case "$TAG" in
            v[0-9]*) : ;;
            *) echo "::error::Unexpected tag '$TAG' (expected v<semver>); refusing to build." >&2; exit 1 ;;
          esac
          SHORT="${TAG#v}"               # v1.2.0 -> 1.2.0
          BUILD="$(git rev-list --count HEAD)"   # monotonic build number; Sparkle compares this
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building $SHORT (build $BUILD)"

      - name: Detect available secrets
        id: gate
        env:
          DEV_ID_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Decoupled gates: notarization needs Apple creds; Sparkle update-signing needs only the
          # EdDSA key; publishing to R2 needs the key + Cloudflare. So updates work WITHOUT Apple
          # (unsigned but EdDSA-signed), and notarization layers on later when the Apple secrets exist.
          NOTARIZE=false
          if [ -n "$DEV_ID_P12" ] && [ -n "$ASC_KEY" ]; then NOTARIZE=true; fi
          SPARKLE=false
          if [ -n "$SPARKLE_KEY" ]; then SPARKLE=true; fi
          PUBLISH=false
          if [ "$SPARKLE" = true ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then PUBLISH=true; fi
          {
            echo "notarize=$NOTARIZE"
            echo "sparkle=$SPARKLE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE  sparkle=$SPARKLE  publish=$PUBLISH"

      - name: Build (release) via xcodebuild
        # Build with xcodebuild (Xcode's build system) rather than `swift build`. Xcode sets up the full
        # SDK/Metal toolchain context, so it compiles SwiftTerm's Metal shader (which `swift build
        # --build-system swiftbuild` fails to do on the runner) AND generates a Bundle.module accessor
        # that resolves resources from Contents/Resources (the native `swift build` accessor looks at the
        # .app ROOT and crashes at launch). Products go to DerivedData/Build/Products/Release, which
        # make-app-bundle.sh consumes via SIMPLETON_BINDIR.
        run: |
          set -euo pipefail
          DD="$RUNNER_TEMP/dd"
          echo "=== available schemes ==="
          xcodebuild -list || true
          # -enableCodeCoverage NO: the auto-generated SPM scheme instruments every compile with
          # -profile-generate / -fcoverage-mapping, which bloats the binary (__LLVM_COV, huge
          # __LINKEDIT) and drops a .profraw at runtime. Disable it for release builds.
          xcodebuild -scheme Simpleton -configuration Release \
            -derivedDataPath "$DD" -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            -enableCodeCoverage NO build
          REL="$DD/Build/Products/Release"
          echo "=== products (Release) ==="
          ls -la "$REL/" || true
          echo "=== resource_bundle_accessor (want Bundle.main.resourceURL) ==="
          acc="$(find "$DD" -name resource_bundle_accessor.swift -path '*Simpleton*' | head -1)"
          if [ -n "$acc" ]; then
            grep -nE 'resourceURL|bundleURL' "$acc" | head -4 || true
          else
            echo "(accessor not found)"
          fi
          echo "=== coverage check (expect no __LLVM_COV) ==="
          if size -m "$REL/Simpleton" | grep -qi LLVM_COV; then
            echo "WARNING: coverage still present in the binary"
          else
            echo "OK: no __LLVM_COV (coverage disabled)"
          fi
          echo "=== derive arm64-only products via lipo ==="
          ARM="$RUNNER_TEMP/arm64products"; mkdir -p "$ARM"
          if lipo -archs "$REL/Simpleton" | grep -qw x86_64; then
            lipo "$REL/Simpleton" -thin arm64 -output "$ARM/Simpleton"
          else
            cp "$REL/Simpleton" "$ARM/Simpleton"
          fi
          ditto "$REL/Sparkle.framework" "$ARM/Sparkle.framework"
          for b in "$REL"/*.bundle; do ditto "$b" "$ARM/$(basename "$b")"; done
          echo "universal binary: $(du -h "$REL/Simpleton" | cut -f1)  |  arm64 binary: $(du -h "$ARM/Simpleton" | cut -f1)"

      - name: Run CoreChecks
        run: swift run -c release CoreChecks

      - name: Import Developer ID certificate
        if: steps.gate.outputs.notarize == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dev_id.p12"
          KC="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          # shellcheck disable=SC2046  # intentional: re-add existing keychains to the search list as args
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          security find-identity -v -p codesigning "$KC"

      - name: Derive per-lane feed URLs
        id: feeds
        # Two lanes, two appcasts on the same public host: universal → appcast.xml (unchanged, so
        # existing universal installs keep updating), arm64 → appcast-arm64.xml (derived).
        env:
          FEED: ${{ vars.SIMPLETON_SU_FEED_URL }}
        run: |
          set -euo pipefail
          {
            echo "uni=$FEED"
            echo "arm=${FEED:+${FEED%/appcast.xml}/appcast-arm64.xml}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble universal app bundle
        env:
          SIMPLETON_SHORT_VERSION: ${{ steps.ver.outputs.short }}
          SIMPLETON_BUILD_VERSION: ${{ steps.ver.outputs.build }}
          # Feed URL + public key are repo VARIABLES (not secrets). Auto-checks turn on when BOTH a
          # feed URL and a public key are configured (independent of Apple signing), so updates work
          # without notarization but we never auto-check a placeholder feed.
          SIMPLETON_SU_FEED_URL: ${{ steps.feeds.outputs.uni }}
          SIMPLETON_SU_PUBLIC_ED_KEY: ${{ vars.SIMPLETON_SU_PUBLIC_ED_KEY }}
          SIMPLETON_SU_AUTO_CHECKS: ${{ (vars.SIMPLETON_SU_PUBLIC_ED_KEY != '' && vars.SIMPLETON_SU_FEED_URL != '') && 'true' || 'false' }}
          SIMPLETON_SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
          # xcodebuild wrote the universal products (binary + *.bundle + Sparkle.framework) here.
          SIMPLETON_BINDIR: ${{ runner.temp }}/dd/Build/Products/Release
          SIMPLETON_APP_OUT: .build/Simpleton-universal.app
        run: bash scripts/e2e/make-app-bundle.sh release

      - name: Assemble arm64 app bundle
        # Same products lipo-thinned to arm64 (prepared in the build step), pointed at the arm64
        # appcast so it auto-updates within its own lane.
        env:
          SIMPLETON_SHORT_VERSION: ${{ steps.ver.outputs.short }}
          SIMPLETON_BUILD_VERSION: ${{ steps.ver.outputs.build }}
          SIMPLETON_SU_FEED_URL: ${{ steps.feeds.outputs.arm }}
          SIMPLETON_SU_PUBLIC_ED_KEY: ${{ vars.SIMPLETON_SU_PUBLIC_ED_KEY }}
          SIMPLETON_SU_AUTO_CHECKS: ${{ (vars.SIMPLETON_SU_PUBLIC_ED_KEY != '' && vars.SIMPLETON_SU_FEED_URL != '') && 'true' || 'false' }}
          SIMPLETON_SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
          SIMPLETON_BINDIR: ${{ runner.temp }}/arm64products
          SIMPLETON_APP_OUT: .build/Simpleton-arm64.app
        run: bash scripts/e2e/make-app-bundle.sh release

      - name: Publish universal lane
        env:
          LANE_LABEL: universal
          LANE_APP: .build/Simpleton-universal.app
          LANE_ZIP: .build/Simpleton-${{ steps.ver.outputs.short }}.zip
          LANE_FEED_URL: ${{ steps.feeds.outputs.uni }}
          LANE_APPCAST_OBJ: appcast.xml
          SHORT: ${{ steps.ver.outputs.short }}
          BUILD: ${{ steps.ver.outputs.build }}
          NOTARIZE: ${{ steps.gate.outputs.notarize }}
          SPARKLE: ${{ steps.gate.outputs.sparkle }}
          PUBLISH: ${{ steps.gate.outputs.publish }}
          SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'simpleton-updates' }}
        run: bash scripts/ci/publish-lane.sh

      - name: Publish arm64 lane
        env:
          LANE_LABEL: arm64
          LANE_APP: .build/Simpleton-arm64.app
          LANE_ZIP: .build/Simpleton-${{ steps.ver.outputs.short }}-arm64.zip
          LANE_FEED_URL: ${{ steps.feeds.outputs.arm }}
          LANE_APPCAST_OBJ: appcast-arm64.xml
          SHORT: ${{ steps.ver.outputs.short }}
          BUILD: ${{ steps.ver.outputs.build }}
          NOTARIZE: ${{ steps.gate.outputs.notarize }}
          SPARKLE: ${{ steps.gate.outputs.sparkle }}
          PUBLISH: ${{ steps.gate.outputs.publish }}
          SIGN_IDENTITY: ${{ vars.SIMPLETON_SIGN_IDENTITY }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'simpleton-updates' }}
        run: bash scripts/ci/publish-lane.sh

      - name: Attach artifacts to GitHub Release
        # Use the gh CLI with the explicit tag rather than a third-party action: no ref inference
        # (softprops mis-resolved the workflow_dispatch ref refs/heads/main), one fewer dependency.
        # Attach both lanes: the universal zip (default download) and the smaller arm64 zip.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          UNI_ZIP: .build/Simpleton-${{ steps.ver.outputs.short }}.zip
          ARM_ZIP: .build/Simpleton-${{ steps.ver.outputs.short }}-arm64.zip
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$UNI_ZIP" "$ARM_ZIP" --clobber
          else
            gh release create "$TAG" "$UNI_ZIP" "$ARM_ZIP" --title "$TAG" --generate-notes --prerelease
          fi
